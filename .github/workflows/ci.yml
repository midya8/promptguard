name: CI

on:
  push:
    branches: [main, promptguard-occurrence-quotas]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: bash examples/demo.sh

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild complete native reports
        run: |
          python tools/build_audits.py
          git diff --exit-code -- docs/audit.json
          python tools/build_quota.py
          git diff --exit-code -- examples/quota.json examples/quota-reports.json docs/quota-data.js
      - name: Independent JavaScript and actual Chrome
        run: npm test
      - name: Isolated installed wheel
        run: |
          bash tools/wheel_smoke.sh
          bash tools/quota_wheel_smoke.sh
