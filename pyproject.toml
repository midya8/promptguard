[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.1.0"
description = "Local-first prompt, secret and prompt-injection linting for AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Midya Rahmani"}]
keywords = ["ai-security", "prompt-injection", "llm", "secrets", "linting"]

[project.urls]
Repository = "https://github.com/midya8/promptguard"

[tool.setuptools.packages.find]
include = ["promptguard*"]
